<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Airbnb Pricing Advisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Inter:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <div id="bg" aria-hidden="true"></div>

  <div id="app">

    <header id="chat-header">
      <div id="header-text">
        <span id="app-title">AI Airbnb Pricing Advisor</span>
        <span id="app-subtitle">תאר את הנכס שלך ואקבע מחיר אופטימלי</span>
      </div>
      <button id="new-chat-btn" title="שיחה חדשה" aria-label="פתח שיחה חדשה">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
          <path fill-rule="evenodd" d="M4.755 10.059a7.5 7.5 0 0112.548-3.364l1.903 1.903h-3.183a.75.75 0 100 1.5h4.992a.75.75 0 00.75-.75V4.356a.75.75 0 00-1.5 0v3.18l-1.9-1.9A9 9 0 003.306 9.67a.75.75 0 101.45.388zm15.408 3.352a.75.75 0 00-.919.53 7.5 7.5 0 01-12.548 3.364l-1.902-1.903h3.183a.75.75 0 000-1.5H3.984a.75.75 0 00-.75.75v4.992a.75.75 0 001.5 0v-3.18l1.9 1.9a9 9 0 0015.059-4.035.75.75 0 00-.53-.918z" clip-rule="evenodd" />
        </svg>
        <span>שיחה חדשה</span>
      </button>
    </header>

    <div id="chat-window" role="log" aria-live="polite" aria-label="שיחת ייעוץ מחירים">
      <div id="typing-indicator" class="bubble bubble-agent hidden" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <div id="input-bar">
      <textarea
        id="user-input"
        placeholder="תאר את הנכס שלך..."
        rows="1"
        dir="auto"
        aria-label="הזן הודעה"
        maxlength="1000"
      ></textarea>
      <button id="send-btn" aria-label="שלח הודעה" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
          <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
        </svg>
      </button>
    </div>

  </div>

  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
